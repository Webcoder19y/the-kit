<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — The Kit</title>
<meta name="description" content="Free password generator. Create strong random passwords with your own length and character rules, right in your browser.">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="../index.html" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      The Kit
    </a>
    <nav class="main-nav">
      <a href="../index.html">Tools</a>
      <a href="../about.html">About</a>
      <a href="../contact.html">Contact</a>
    </nav>
  </div>
</header>

<div class="tool-header">
  <div class="wrap">
    <a href="../index.html" class="breadcrumb">&larr; all tools</a>
    <h1>Password Generator</h1>
    <p class="lede">Set your rules, generate a password, copy it. Everything happens on your device — nothing is stored or sent anywhere.</p>
  </div>
</div>

<div class="tool-body">
  <div class="wrap">

    <div class="panel">
      <label for="pw-output">generated password</label>
      <div class="output-box" id="pw-output" style="font-size: 1.2rem;">&nbsp;</div>

      <div class="btn-row">
        <button class="btn" id="generate-btn">Generate new</button>
        <button class="btn btn-ghost" id="copy-btn">Copy</button>
      </div>

      <div class="field-row" style="margin-top:28px;">
        <div>
          <label for="length">length: <span id="length-value">16</span></label>
          <input type="range" id="length" min="6" max="48" value="16" style="width:100%;">
        </div>
      </div>

      <div style="margin-top:16px;">
        <div class="checkbox-row">
          <input type="checkbox" id="opt-upper" checked>
          <label for="opt-upper">Uppercase letters (A-Z)</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="opt-lower" checked>
          <label for="opt-lower">Lowercase letters (a-z)</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="opt-numbers" checked>
          <label for="opt-numbers">Numbers (0-9)</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="opt-symbols" checked>
          <label for="opt-symbols">Symbols (!@#$%...)</label>
        </div>
      </div>

      <div class="stat-strip">
        <div><span class="n" id="strength-label">—</span><span class="l">strength estimate</span></div>
      </div>
    </div>

    <!-- Ad slot: place an AdSense in-article unit here once approved -->
    <div class="ad-slot">ad slot</div>

  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <span class="foot-note">&copy; <span id="year"></span> The Kit</span>
    <nav>
      <a href="../about.html">About</a>
      <a href="../privacy.html">Privacy</a>
      <a href="../contact.html">Contact</a>
    </nav>
  </div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const lengthSlider = document.getElementById('length');
const lengthValue = document.getElementById('length-value');
const output = document.getElementById('pw-output');
const strengthLabel = document.getElementById('strength-label');

const optUpper = document.getElementById('opt-upper');
const optLower = document.getElementById('opt-lower');
const optNumbers = document.getElementById('opt-numbers');
const optSymbols = document.getElementById('opt-symbols');

const SETS = {
  upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lower: 'abcdefghijklmnopqrstuvwxyz',
  numbers: '0123456789',
  symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
};

function randomInt(max) {
  const array = new Uint32Array(1);
  crypto.getRandomValues(array);
  return array[0] % max;
}

function generate() {
  let pool = '';
  if (optUpper.checked) pool += SETS.upper;
  if (optLower.checked) pool += SETS.lower;
  if (optNumbers.checked) pool += SETS.numbers;
  if (optSymbols.checked) pool += SETS.symbols;

  if (pool === '') {
    output.textContent = 'Pick at least one character type below.';
    strengthLabel.textContent = '—';
    return;
  }

  const length = parseInt(lengthSlider.value, 10);
  let password = '';
  for (let i = 0; i < length; i++) {
    password += pool[randomInt(pool.length)];
  }

  output.textContent = password;
  updateStrength(length, pool.length);
}

function updateStrength(length, poolSize) {
  const entropy = length * Math.log2(poolSize);
  let label;
  if (entropy < 40) label = 'Weak';
  else if (entropy < 70) label = 'Okay';
  else if (entropy < 100) label = 'Strong';
  else label = 'Very strong';
  strengthLabel.textContent = label;
}

lengthSlider.addEventListener('input', () => {
  lengthValue.textContent = lengthSlider.value;
  generate();
});

[optUpper, optLower, optNumbers, optSymbols].forEach(el => {
  el.addEventListener('change', generate);
});

document.getElementById('generate-btn').addEventListener('click', generate);

document.getElementById('copy-btn').addEventListener('click', () => {
  const text = output.textContent;
  if (!text || text.includes('Pick at least')) return;
  navigator.clipboard.writeText(text);
  const btn = document.getElementById('copy-btn');
  const original = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(() => { btn.textContent = original; }, 1500);
});

generate();
</script>

</body>
</html>
